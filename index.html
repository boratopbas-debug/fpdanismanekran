<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danışman Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="haneler-v3.css">
</head>
<body>

<div class="app-shell">

  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">DM</div>
      <div>
        <p class="brand-name">Danışman Masası</p>
        <p class="brand-sub">Finansal planlama sistemi</p>
      </div>
    </div>

    <div class="sidebar-nav">
      <button class="nav-item" data-route="ana-panel">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 10L10 3L17 10M5 8V16.5C5 16.78 5.22 17 5.5 17H8.5C8.78 17 9 16.78 9 16.5V12.5C9 12.22 9.22 12 9.5 12H10.5C10.78 12 11 12.22 11 12.5V16.5C11 16.78 11.22 17 11.5 17H14.5C14.78 17 15 16.78 15 16.5V8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Ana panel</span>
      </button>
      <button class="nav-item" data-route="musteriler">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="7" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="14" cy="7.5" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 16.5C2.5 13.5 4.5 11.5 7.5 11.5C10 11.5 11.8 12.9 12.3 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12.5 12C14.8 12.2 16.5 13.6 16.9 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Müşterilerim</span>
      </button>
      <button class="nav-item" data-route="onay-kuyrugu">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 8.5L9 10.5L13.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Onay kuyruğu</span>
        <span class="nav-badge" id="approval-count">4</span>
      </button>
      <button class="nav-item" data-route="portfoy">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 16.5V9.5M8 16.5V5.5M13 16.5V11.5M17.5 16.5H2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Portföy yönetimi</span>
      </button>
      <button class="nav-item" data-route="raporlar">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M6 2.5H12L15.5 6V16C15.5 16.55 15.05 17 14.5 17H6C5.45 17 5 16.55 5 16V3.5C5 2.95 5.45 2.5 6 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 9.5H12.5M7.5 12.5H12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Raporlar</span>
      </button>
      <button class="nav-item" data-route="haneler">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 9L10 3L17 9V16.5C17 16.78 16.78 17 16.5 17H12.5V12H7.5V17H3.5C3.22 17 3 16.78 3 16.5V9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Haneler</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="advisor-chip">
        <div class="advisor-avatar">BK</div>
        <div>
          <p class="advisor-name">Bora K.</p>
          <p class="advisor-role">Finansal danışman</p>
        </div>
      </div>
    </div>
  </nav>

  <main class="content" id="content">
  </main>

  <button class="hamburger" id="hamburger" aria-label="Menüyü aç">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5H17M3 10H17M3 15H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>

</div>

<script src="app.js"></script>
<script src="haneler-v3.js"></script>
</body>
</html>
